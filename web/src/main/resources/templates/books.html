<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="uk">
<head>
    <meta charset="UTF-8">
    <title>BookApp — Каталог книг</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f6f9; color: #222; margin: 0; padding: 30px; }
        .container { max-width: 900px; margin: 0 auto; background: #fff; padding: 25px; border-radius: 8px; box-shadow: 0 2px 6px rgba(0,0,0,0.08); }
        h1 { margin-top: 0; color: #1e293b; }
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .btn { display: inline-block; padding: 10px 16px; background: #2563eb; color: #fff; text-decoration: none; border-radius: 5px; font-weight: bold; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 12px; border-bottom: 1px solid #e2e8f0; text-align: left; }
        th { background: #f8fafc; }
        .badge-rare { background: #fef3c7; color: #a36b00; padding: 3px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; }
    </style>
</head>
<body>
<div class="container">
    <div class="top-bar">
        <h1>Каталог книг BookApp</h1>
        <a class="btn" th:href="@{/books/add}">+ Додати книгу</a>
    </div>
    <table>
        <thead>
        <tr>
            <th>ID</th>
            <th>Назва</th>
            <th>Автор</th>
            <th>Рік</th>
            <th>Статус</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="b : ${books}">
            <td th:text="${b.id}">1</td>
            <td th:text="${b.title}">Title</td>
            <td th:text="${b.author}">Author</td>
            <td th:text="${b.year}">2020</td>
            <td>
                <span th:if="${b.year < 2000}" class="badge-rare">Раритетне видання!</span>
                <span th:unless="${b.year < 2000}">Сучасне видання</span>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
