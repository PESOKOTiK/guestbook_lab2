<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Додати книгу — BookApp</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f6f9; color: #222; margin: 0; padding: 30px; }
        .container { max-width: 560px; margin: 0 auto; background: #fff; padding: 25px; border-radius: 8px; box-shadow: 0 2px 6px rgba(0,0,0,0.08); }
        label { display: block; margin-top: 14px; font-weight: bold; }
        input, textarea { width: 100%; padding: 9px; margin-top: 5px; border: 1px solid #cbd5e1; border-radius: 5px; box-sizing: border-box; }
        button { margin-top: 20px; padding: 10px 18px; background: #2563eb; color: #fff; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; }
        a { margin-left: 12px; color: #64748b; text-decoration: none; }
    </style>
</head>
<body>
<div class="container">
    <h1>Додати нову книгу</h1>
    <form th:action="@{/books/add}" th:object="${book}" method="post">
        <label>Назва книги:</label>
        <input type="text" th:field="*{title}" placeholder="Наприклад: The Pragmatic Programmer" required />

        <label>Автор:</label>
        <input type="text" th:field="*{author}" placeholder="Наприклад: Andrew Hunt, David Thomas" required />

        <label>Рік видання (якщо &lt; 2000 — буде позначено як раритетне):</label>
        <input type="number" th:field="*{year}" value="1999" required />

        <label>Опис:</label>
        <textarea th:field="*{description}" rows="3" placeholder="Короткий опис книги"></textarea>

        <button type="submit">Зберегти та надіслати e-mail</button>
        <a th:href="@{/books}">Скасувати</a>
    </form>
</div>
</body>
</html>
