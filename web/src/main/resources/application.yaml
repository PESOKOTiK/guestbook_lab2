spring:
  application:
    name: book-catalog-spring-boot
  datasource:
    url: jdbc:h2:mem:catalogdb;DB_CLOSE_DELAY=-1
    username: sa
    password: ""

server:
  port: 8080

catalog:
  default-page-size: 10
  welcome-banner: "Ласкаво просимо до каталогу книг на базі Spring Boot 3!"
  comment:
    delete-window-hours: 24
